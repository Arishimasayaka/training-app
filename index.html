<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>筋トレアプリ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --completed-bg: #0d2720;
            --completed-border: #10b981;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 16px 16px 12px 16px;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .today-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* --- 曜日切り替えタブ --- */
        .day-tabs {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            margin-top: 10px;
            background-color: #0f172a;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        .btn-day-tab {
            flex: 1;
            padding: 8px 0;
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }

        .btn-day-tab.active {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-day-tab.is-today-marker::after {
            content: "•";
            display: block;
            font-size: 1rem;
            line-height: 0.3;
            color: #10b981;
        }

        .workout-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
        }

        .workout-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
        }

        .btn-reset-today {
            background-color: #334155;
            border: 1px solid #475569;
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .progress-container {
            background-color: #334155;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .progress-bar {
            height: 100%;
            background-color: #10b981;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.8rem;
            color: var(--text-sub);
            text-align: right;
        }

        main {
            padding: 16px;
        }

        .quote-card {
            background: linear-gradient(135deg, #1e1b4b, #311b92);
            border: 1px solid #6366f1;
            border-radius: var(--border-radius);
            padding: 14px 16px;
            margin-bottom: 16px;
            position: relative;
        }

        .quote-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .quote-tag {
            font-size: 0.75rem;
            font-weight: bold;
            color: #a5b4fc;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
        }

        .quote-refresh-btn {
            background: transparent;
            border: none;
            color: #c7d2fe;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .quote-text {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .quote-author {
            font-size: 0.8rem;
            color: #cbd5e1;
            text-align: right;
            font-style: italic;
        }

        .target-guide-card {
            background-color: #0d2038;
            border: 1px solid #1e40af;
            border-radius: var(--border-radius);
            padding: 14px 16px;
            margin-bottom: 20px;
        }

        .target-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .target-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 0.8rem;
        }

        .target-item {
            background-color: rgba(15, 23, 42, 0.6);
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #1e293b;
        }

        .target-item-title {
            color: #93c5fd;
            font-weight: bold;
            margin-bottom: 2px;
        }

        .target-item-val {
            color: #f8fafc;
            font-weight: 600;
        }

        .special-day-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 32px 16px;
            text-align: center;
            border: 1px solid #334155;
            margin-top: 20px;
        }

        .special-day-title {
            font-size: 1.8rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 12px;
        }

        .special-day-desc {
            color: var(--text-sub);
            font-size: 1rem;
        }

        .section-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 24px 0 12px 0;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #334155;
            transition: all 0.2s ease;
            position: relative;
        }

        .exercise-card.completed {
            background-color: var(--completed-bg);
            border-color: var(--completed-border);
            opacity: 0.9;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .exercise-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .btn-edit-lock {
            background-color: #334155;
            border: 1px solid #475569;
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        .exercise-diagram-box {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #334155;
        }

        .diagram-svg {
            width: 65px;
            height: 65px;
            background-color: #1e293b;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .guide-info {
            flex: 1;
        }

        .guide-desc {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .yt-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #ff4545;
            font-size: 0.8rem;
            font-weight: bold;
            text-decoration: none;
            background-color: #2a1215;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #5c1d24;
        }

        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .number-control {
            display: flex;
            align-items: center;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        .btn-num {
            background-color: #334155;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .num-val {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .sets-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .set-item-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .set-item-card.locked {
            background-color: #0d2720;
            border-color: #10b981;
        }

        .set-label {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--text-sub);
            width: 60px;
        }

        .counter-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-count {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .count-display {
            font-size: 1rem;
            font-weight: bold;
            color: #38bdf8;
            min-width: 45px;
            text-align: center;
        }

        .btn-finish-set {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-complete {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .completed .btn-complete {
            background-color: #059669;
        }

        .timer-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-top: 24px;
            border: 1px solid #334155;
            text-align: center;
        }

        .timer-display {
            font-size: 3rem;
            font-weight: bold;
            font-family: monospace;
            margin: 8px 0;
            color: #38bdf8;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .btn-timer {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--accent-color);
            color: white;
        }

        .btn-timer.secondary {
            background-color: #475569;
        }

        .chart-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            border: 1px solid #334155;
            margin-top: 12px;
        }

        .chart-select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background-color: #0f172a;
            color: white;
            border: 1px solid #334155;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .log-list {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: var(--border-radius);
            padding: 12px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .log-item {
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--text-sub);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>筋トレアプリ</h1>
            <div id="today-badge" class="today-badge">-</div>
        </div>

        <!-- 曜日切り替えタブ -->
        <div class="day-tabs">
            <button class="btn-day-tab" onclick="switchSelectedDay('月')">月</button>
            <button class="btn-day-tab" onclick="switchSelectedDay('火')">火</button>
            <button class="btn-day-tab" onclick="switchSelectedDay('水')">水</button>
            <button class="btn-day-tab" onclick="switchSelectedDay('木')">木</button>
            <button class="btn-day-tab" onclick="switchSelectedDay('金')">金</button>
            <button class="btn-day-tab" onclick="switchSelectedDay('土')">土</button>
            <button class="btn-day-tab" onclick="switchSelectedDay('日')">日</button>
        </div>

        <div class="workout-title-row">
            <div id="workout-title" class="workout-title">読み込み中...</div>
            <button id="btn-today-reset" class="btn-reset-today" onclick="resetToToday()" style="display:none;">今日へ戻る</button>
        </div>

        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">0 / 0 完了</div>
    </header>

    <main>
        <!-- モチベーション名言エリア -->
        <div class="quote-card">
            <div class="quote-header">
                <span id="quote-tag" class="quote-tag">🔥 モチベーション</span>
                <button class="quote-refresh-btn" onclick="getRandomQuote()">🔄 別の名言</button>
            </div>
            <div id="quote-text" class="quote-text">読み込み中...</div>
            <div id="quote-author" class="quote-author"></div>
        </div>

        <!-- 50代男性向け目標目安ガイド -->
        <div class="target-guide-card">
            <div class="target-title">
                <span>🎯 50代男性の目標目安（10回×3セット）</span>
            </div>
            <div class="target-grid">
                <div class="target-item">
                    <div class="target-item-title">バーベルベンチプレス</div>
                    <div class="target-item-val">40 kg 〜 60 kg</div>
                </div>
                <div class="target-item">
                    <div class="target-item-title">バーベルスクワット</div>
                    <div class="target-item-val">50 kg 〜 75 kg</div>
                </div>
                <div class="target-item">
                    <div class="target-item-title">ラットプルダウン</div>
                    <div class="target-item-val">35 kg 〜 45 kg</div>
                </div>
                <div class="target-item">
                    <div class="target-item-title">バーベルショルダープレス</div>
                    <div class="target-item-val">20 kg 〜 35 kg</div>
                </div>
            </div>
        </div>

        <div id="special-day-container"></div>

        <div id="uncompleted-section">
            <div class="section-header">🏋️ 未完了の種目（トレーニング中）</div>
            <div id="uncompleted-list"></div>
        </div>

        <div id="completed-section" style="margin-top: 24px;">
            <div class="section-header">✅ 完了済みの種目（ロック中）</div>
            <div id="completed-list"></div>
        </div>

        <div id="stretch-section" class="timer-card">
            <h3>🧘 前屈・もも裏 柔軟ストレッチ（5分）</h3>
            <p style="color: var(--text-sub); font-size: 0.8rem; margin-top: 2px;">身体が固い方向け（息を吐きながら伸ばす）</p>
            <div id="stretch-name" style="margin-top: 12px; font-weight: bold; font-size: 1.1rem; color: #38bdf8;">準備完了</div>
            <div id="stretch-timer" class="timer-display">01:00</div>
            <div class="timer-controls">
                <button id="stretch-start-btn" class="btn-timer" onclick="toggleStretchTimer()">スタート</button>
                <button class="btn-timer secondary" onclick="nextStretch()">次へ</button>
            </div>
            <div id="stretch-step-text" style="font-size: 0.85rem; color: var(--text-sub);">種目 1 / 5</div>
        </div>

        <div style="margin-top: 32px;">
            <div class="section-header">📈 重量・回数の成長推移グラフ</div>
            <div class="chart-card">
                <select id="chart-exercise-select" class="chart-select" onchange="updateChart()"></select>
                <canvas id="growthChart" height="200"></canvas>
            </div>
        </div>

        <div style="margin-top: 32px;">
            <div class="section-header">📜 過去の全トレーニング記録</div>
            <div id="log-list" class="log-list"></div>
        </div>
    </main>

    <script>
        const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

        const MOTIVATIONAL_QUOTES = [
            { text: "限界を決めるのは自分自身だ。あと1回挙げた時、身体は確実に変わる。", author: "アーノルド・シュワルツェネッガー", type: "名言" },
            { text: "準備に妥協がなければ、結果に対して不安になることはない。", author: "イチロー", type: "アスリート" },
            { text: "筋肉は裏切らない。かけた時間と努力は、そのまま自分の力になる。", author: "筋トレの真理", type: "格言" },
            { text: "バーベル種目は全身の連動性を高め、体幹を強くするのに最も効果的！", author: "トレーニング雑学", type: "豆知識" },
            { text: "今日やらなかった後悔は、明日やってくる筋肉痛よりずっと重い。", author: "トレーニング格言", type: "モチベーション" },
            { text: "スクワットやバーベルデッドリフトを行うと、テストステロンが分泌され若々しさが保たれる。", author: "健康雑学", type: "豆知識" },
            { text: "勝者とは、倒れても起き上がり続ける者のことだ。", author: "コナー・マクレガー", type: "アスリート" }
        ];

        const HAMSTRING_STRETCHES = [
            { name: "1. ジャックナイフ（つまみ持ちで胸とももを密着）" },
            { name: "2. 骨盤立て片足伸ばし（お尻を引いてもも裏伸ばし）" },
            { name: "3. 股関節前側伸ばし（骨盤を前へ押し出す）" },
            { name: "4. お尻・臀筋ストレッチ（膝を胸に引き寄せる）" },
            { name: "5. 全身前屈リセット（息を深く吐きながら）" }
        ];

        const EXERCISE_DIAGRAMS = {
            "バーベルベンチプレス": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><rect x="15" y="60" width="70" height="10" fill="#94a3b8"/><circle cx="35" cy="50" r="8" fill="#38bdf8"/><line x1="10" y1="30" x2="90" y2="30" stroke="#ef4444" stroke-width="6"/><line x1="35" y1="50" x2="35" y2="30" stroke="#10b981" stroke-width="4"/></svg>`,
                desc: "仰向けになりバーベルを胸の上に深く下ろして押し上げる動作（胸全体）"
            },
            "バーベルスクワット": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="45" cy="35" r="8" fill="#38bdf8"/><line x1="20" y1="30" x2="70" y2="30" stroke="#ef4444" stroke-width="6"/><path d="M 45 43 L 40 65 L 55 85" stroke="#38bdf8" stroke-width="6" fill="none"/></svg>`,
                desc: "肩にバーベルを担ぎお尻をひいてしゃがみ込む動作（下半身最強）"
            },
            "バーベルデッドリフト": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><line x1="15" y1="75" x2="85" y2="75" stroke="#ef4444" stroke-width="6"/><circle cx="45" cy="40" r="8" fill="#38bdf8"/><path d="M 45 48 L 40 75" stroke="#38bdf8" stroke-width="6"/></svg>`,
                desc: "床からバーベルを持ち上げて体を起こす動作（背中・お尻・もも裏）"
            },
            "バーベルショルダープレス": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><line x1="15" y1="20" x2="85" y2="20" stroke="#ef4444" stroke-width="6"/><circle cx="50" cy="45" r="8" fill="#38bdf8"/><line x1="50" y1="53" x2="50" y2="80" stroke="#38bdf8" stroke-width="6"/></svg>`,
                desc: "鎖骨の前から頭上へ向かってバーベルを押し上げる動作（肩・三角筋）"
            },
            "バーベルカール": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="50" cy="30" r="8" fill="#38bdf8"/><line x1="50" y1="38" x2="50" y2="75" stroke="#38bdf8" stroke-width="6"/><line x1="25" y1="55" x2="75" y2="55" stroke="#ef4444" stroke-width="6"/></svg>`,
                desc: "肘の位置を固定し、バーベルを胸の高さまで巻き上げる動作（力こぶ）"
            },
            "チェストプレス": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="30" cy="40" r="8" fill="#38bdf8"/><rect x="25" y="48" width="10" height="25" fill="#38bdf8"/><path d="M 35 55 L 65 55" stroke="#10b981" stroke-width="4"/></svg>`,
                desc: "座ってグリップを前面へ押し出す動作（大胸筋）"
            },
            "インクラインダンベルプレス": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><line x1="20" y1="80" x2="60" y2="40" stroke="#94a3b8" stroke-width="6"/><circle cx="45" cy="35" r="8" fill="#38bdf8"/></svg>`,
                desc: "斜めベンチでダンベルを上方へ持ち上げる動作（胸上部）"
            },
            "ケーブルフライ": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="50" cy="30" r="8" fill="#38bdf8"/><path d="M 20 40 Q 50 60 80 40" stroke="#10b981" stroke-width="4" fill="none"/></svg>`,
                desc: "ワイヤーを前で寄せて胸を中心まで収縮させる動作"
            },
            "ラットプルダウン": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><line x1="20" y1="20" x2="80" y2="20" stroke="#ef4444" stroke-width="6"/><circle cx="50" cy="45" r="8" fill="#38bdf8"/></svg>`,
                desc: "頭上のバーを胸の上に引っ張り下ろす動作（背中広範囲）"
            },
            "シーテッドローイング": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="35" cy="40" r="8" fill="#38bdf8"/><path d="M 70 55 L 45 55" stroke="#10b981" stroke-width="4"/></svg>`,
                desc: "正面からお腹に向かってグリップを引く動作（背中中央）"
            },
            "ショルダープレス": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="50" cy="45" r="8" fill="#38bdf8"/><line x1="30" y1="20" x2="70" y2="20" stroke="#ef4444" stroke-width="6"/></svg>`,
                desc: "真上に向かって重量をまっすぐ押し上げる動作（肩全体）"
            },
            "サイドレイズ": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="50" cy="30" r="8" fill="#38bdf8"/><path d="M 20 45 L 50 45 L 80 45" stroke="#10b981" stroke-width="4"/></svg>`,
                desc: "両腕を真横に広げて持ち上げる動作（肩の側面）"
            },
            "レッグプレス": {
                svg: `<svg viewBox="0 0 100 100" width="50" height="50"><rect x="20" y="50" width="30" height="20" fill="#94a3b8"/><circle cx="30" cy="40" r="8" fill="#38bdf8"/></svg>`,
                desc: "斜め上のプレートを足裏全体で押し出す動作（太もも・お尻）"
            }
        };

        const INITIAL_PAST_LOGS = [
            { timestamp: "2026/09/17 09:30", exercise: "バーベルベンチプレス", weight: 45.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/17 09:30", exercise: "ケーブルフライ", weight: 10.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/17 09:10", exercise: "サイドレイズ", weight: 12.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/15 19:07", exercise: "シーテッドローイング", weight: 35.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/15 18:59", exercise: "ラットプルダウン", weight: 35.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/12 09:30", exercise: "バーベルスクワット", weight: 50.0, reps: 10, sets: 3 }
        ];

        const SCHEDULE = {
            "月": { title: "胸", special: null },
            "火": { title: "背中", special: null },
            "水": { title: "ボクシングレッスン", special: "今日はボクシングレッスン（筋トレなし）" },
            "木": { title: "肩・肩幅", special: null },
            "金": { title: "休養", special: "今日は休養日（筋トレなし）" },
            "土": { title: "全身ガッツリ（多め）", special: null },
            "日": { title: "弱点強化＆調整（多め）", special: null }
        };

        // 土曜日・日曜日のメニューを多め（8種目構成）＆バーベル種目を追加
        const INITIAL_MENU = {
            "月": ["バーベルベンチプレス", "チェストプレス", "インクラインダンベルプレス", "ケーブルフライ", "デッドバグ"],
            "火": ["バーベルデッドリフト", "ラットプルダウン", "シーテッドローイング", "バーベルカール", "フェイスプル"],
            "木": ["バーベルショルダープレス", "ショルダープレス", "サイドレイズ", "ケーブルフライ", "アブ系"],
            "土": ["バーベルスクワット", "バーベルベンチプレス", "レッグプレス", "ラットプルダウン", "バーベルショルダープレス", "チェストプレス", "バーベルカール", "アブ系"],
            "日": ["バーベルデッドリフト", "バーベルベンチプレス", "ショルダープレス", "サイドレイズ", "ラットプルダウン", "ケーブルフライ", "レッグエクステンション", "デッドバグ"]
        };

        let realTodayDayOfWeek = "";
        let selectedDayOfWeek = "";

        let state = {
            exercises: [],
            stretchIndex: 0,
            stretchTime: 60,
            stretchRunning: false
        };

        let myChart = null;
        let stretchInterval = null;

        function getTodayInfo() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${date}`;
            const dayOfWeek = WEEKDAYS[now.getDay()];
            return { dateStr, dayOfWeek, now };
        }

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * MOTIVATIONAL_QUOTES.length);
            const quote = MOTIVATIONAL_QUOTES[randomIndex];
            document.getElementById("quote-tag").innerText = "🔥 " + quote.type;
            document.getElementById("quote-text").innerText = `「${quote.text}」`;
            document.getElementById("quote-author").innerText = quote.author ? `— ${quote.author}` : "";
        }

        function initApp() {
            const { dateStr, dayOfWeek } = getTodayInfo();
            realTodayDayOfWeek = dayOfWeek;
            selectedDayOfWeek = dayOfWeek;

            if (!localStorage.getItem("kintore_logs")) {
                localStorage.setItem("kintore_logs", JSON.stringify(INITIAL_PAST_LOGS));
            }

            loadDayData(selectedDayOfWeek);

            getRandomQuote();
            renderHeader();
            renderContent();
            renderStretchUI();
            renderHistoryLogs();
            initChartSelect();
        }

        function loadDayData(day) {
            const { dateStr } = getTodayInfo();
            const key = "kintore_menu_" + day;
            const saved = localStorage.getItem(key);

            if (saved) {
                state.exercises = JSON.parse(saved);
            } else {
                const names = INITIAL_MENU[day] || [];
                state.exercises = names.map(name => ({
                    name: name,
                    weight: name.includes("バーベル") ? 40.0 : 20.0,
                    reps: 10,
                    setsData: [
                        { count: 0, locked: false },
                        { count: 0, locked: false },
                        { count: 0, locked: false }
                    ],
                    completed: false
                }));
                saveState();
            }
        }

        function saveState() {
            const key = "kintore_menu_" + selectedDayOfWeek;
            localStorage.setItem(key, JSON.stringify(state.exercises));
        }

        function switchSelectedDay(day) {
            selectedDayOfWeek = day;
            loadDayData(day);
            renderHeader();
            renderContent();
        }

        function resetToToday() {
            switchSelectedDay(realTodayDayOfWeek);
        }

        function saveHistoryLog(exName, weight, reps, setsCount) {
            const { dateStr, now } = getTodayInfo();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const logs = JSON.parse(localStorage.getItem("kintore_logs") || "[]");

            logs.unshift({
                timestamp: `${dateStr.replace(/-/g, '/')} ${timeStr}`,
                exercise: exName,
                weight: weight,
                reps: reps,
                sets: setsCount
            });

            localStorage.setItem("kintore_logs", JSON.stringify(logs));
            renderHistoryLogs();
            updateChart();
        }

        function renderHistoryLogs() {
            const container = document.getElementById("log-list");
            const logs = JSON.parse(localStorage.getItem("kintore_logs") || "[]");

            if (logs.length === 0) {
                container.innerHTML = "まだ記録はありません。";
                return;
            }

            container.innerHTML = logs.map(l => `
                <div class="log-item">
                    <div>
                        <strong>${l.exercise}</strong> (${l.weight}kg × ${l.reps}回 × ${l.sets}セット)
                    </div>
                    <div class="log-time">${l.timestamp}</div>
                </div>
            `).join('');
        }

        function initChartSelect() {
            const select = document.getElementById("chart-exercise-select");
            const logs = JSON.parse(localStorage.getItem("kintore_logs") || "[]");
            const exercises = [...new Set(logs.map(l => l.exercise))];

            select.innerHTML = exercises.map(ex => `<option value="${ex}">${ex}</option>`).join('');
            if (exercises.length > 0) {
                updateChart();
            }
        }

        function updateChart() {
            const select = document.getElementById("chart-exercise-select");
            const selectedEx = select.value;
            const logs = JSON.parse(localStorage.getItem("kintore_logs") || "[]");

            const exLogs = logs.filter(l => l.exercise === selectedEx).reverse();

            const labels = exLogs.map(l => l.timestamp.split(' ')[0]);
            const weights = exLogs.map(l => l.weight);
            const totalReps = exLogs.map(l => l.reps * l.sets);

            const ctx = document.getElementById('growthChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '重量 (kg)',
                            data: weights,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.2)',
                            yAxisID: 'y',
                            tension: 0.2
                        },
                        {
                            label: '合計回数 (回)',
                            data: totalReps,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.2)',
                            yAxisID: 'y1',
                            tension: 0.2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { ticks: { color: '#94a3b8' } },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'kg', color: '#3b82f6' },
                            ticks: { color: '#94a3b8' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: '回', color: '#10b981' },
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#f8fafc' } }
                    }
                }
            });
        }

        function renderHeader() {
            document.getElementById("today-badge").innerText = "本日: " + realTodayDayOfWeek + "曜日";
            const info = SCHEDULE[selectedDayOfWeek];
            document.getElementById("workout-title").innerText = selectedDayOfWeek + "曜日： " + info.title;

            // タブの表示更新
            document.querySelectorAll('.btn-day-tab').forEach(btn => {
                const dayStr = btn.innerText.trim().charAt(0);
                btn.classList.toggle('active', dayStr === selectedDayOfWeek);
                btn.classList.toggle('is-today-marker', dayStr === realTodayDayOfWeek);
            });

            // 今日に戻るボタンの表示・非表示
            const btnReset = document.getElementById("btn-today-reset");
            if (selectedDayOfWeek !== realTodayDayOfWeek) {
                btnReset.style.display = "block";
            } else {
                btnReset.style.display = "none";
            }

            if (info.special) {
                document.getElementById("progress-bar").style.width = "0%";
                document.getElementById("progress-text").innerText = "";
            } else {
                const total = state.exercises.length;
                const done = state.exercises.filter(e => e.completed).length;
                const pct = total === 0 ? 0 : Math.round((done / total) * 100);
                document.getElementById("progress-bar").style.width = pct + "%";
                document.getElementById("progress-text").innerText = `${done} / ${total} 完了`;
            }
        }

        function renderContent() {
            const info = SCHEDULE[selectedDayOfWeek];
            const specialContainer = document.getElementById("special-day-container");
            const uncompletedSection = document.getElementById("uncompleted-section");
            const completedSection = document.getElementById("completed-section");

            specialContainer.innerHTML = "";

            if (info.special) {
                specialContainer.innerHTML = `
                    <div class="special-day-card">
                        <div class="special-day-title">${info.special}</div>
                        <div class="special-day-desc">しっかりと身体を休めてコンディションを整えましょう。</div>
                    </div>
                `;
                uncompletedSection.style.display = "none";
                completedSection.style.display = "none";
                return;
            }

            uncompletedSection.style.display = "block";
            completedSection.style.display = "block";
            renderExercises();
        }

        function renderExercises() {
            const uncompletedList = document.getElementById("uncompleted-list");
            const completedList = document.getElementById("completed-list");

            uncompletedList.innerHTML = "";
            completedList.innerHTML = "";

            state.exercises.forEach((ex, idx) => {
                const card = document.createElement("div");
                card.className = "exercise-card" + (ex.completed ? " completed" : "");
                
                const diagram = EXERCISE_DIAGRAMS[ex.name] || {
                    svg: `<svg viewBox="0 0 100 100" width="50" height="50"><circle cx="50" cy="40" r="10" fill="#38bdf8"/><path d="M 50 50 L 50 80" stroke="#38bdf8" stroke-width="6"/></svg>`,
                    desc: "姿勢と動作を意識して行いましょう。"
                };
                const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' フォーム Shorts')}`;

                card.innerHTML = `
                    <div class="card-top">
                        <div class="exercise-name">${ex.name}</div>
                        ${ex.completed ? `<button class="btn-edit-lock" onclick="toggleComplete(${idx})">✏️ 記録を編集</button>` : ''}
                    </div>

                    <div class="exercise-diagram-box">
                        <div class="diagram-svg">${diagram.svg}</div>
                        <div class="guide-info">
                            <div class="guide-desc">${diagram.desc}</div>
                            <a href="${ytSearchUrl}" target="_blank" class="yt-link">🎬 Shorts動画を見る</a>
                        </div>
                    </div>

                    <div class="controls-row">
                        <div class="input-group">
                            <label>重量 (kg)</label>
                            <div class="number-control">
                                <button class="btn-num" onclick="updateVal(${idx}, 'weight', -0.5)" ${ex.completed ? 'disabled style="opacity:0.3;"' : ''}>-</button>
                                <div class="num-val">${ex.weight.toFixed(1)}</div>
                                <button class="btn-num" onclick="updateVal(${idx}, 'weight', 0.5)" ${ex.completed ? 'disabled style="opacity:0.3;"' : ''}>+</button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>目標回数</label>
                            <div class="number-control">
                                <button class="btn-num" onclick="updateVal(${idx}, 'reps', -1)" ${ex.completed ? 'disabled style="opacity:0.3;"' : ''}>-</button>
                                <div class="num-val">${ex.reps}回</div>
                                <button class="btn-num" onclick="updateVal(${idx}, 'reps', 1)" ${ex.completed ? 'disabled style="opacity:0.3;"' : ''}>+</button>
                            </div>
                        </div>
                    </div>

                    <div class="sets-container">
                        ${ex.setsData.map((s, sIdx) => `
                            <div class="set-item-card ${s.locked || ex.completed ? 'locked' : ''}">
                                <div class="set-label">セット ${sIdx + 1}</div>
                                <div class="counter-box">
                                    ${s.locked || ex.completed ? `
                                        <div class="count-display" style="color:#10b981;">✓ ${s.count} 回完了</div>
                                    ` : `
                                        <button class="btn-count" onclick="countUp(${idx}, ${sIdx})">1回！</button>
                                        <div class="count-display">${s.count} / ${ex.reps}</div>
                                    `}
                                </div>
                                <button class="btn-finish-set" onclick="toggleLockSet(${idx}, ${sIdx})" ${ex.completed ? 'style="display:none;"' : ''}>
                                    ${s.locked ? '解除' : '終了'}
                                </button>
                            </div>
                        `).join('')}
                    </div>

                    ${!ex.completed ? `
                        <button class="btn-complete" onclick="toggleComplete(${idx})">
                            この種目を完了（一番下へ移動）
                        </button>
                    ` : ''}
                `;

                if (ex.completed) {
                    completedList.appendChild(card);
                } else {
                    uncompletedList.appendChild(card);
                }
            });
        }

        function renderStretchUI() {
            if (state.stretchIndex >= HAMSTRING_STRETCHES.length) {
                document.getElementById("stretch-name").innerText = "本日の柔軟ストレッチ完了！";
                document.getElementById("stretch-timer").innerText = "00:00";
                document.getElementById("stretch-start-btn").style.display = "none";
                document.getElementById("stretch-step-text").innerText = "5 / 5 完了";
                return;
            }

            document.getElementById("stretch-name").innerText = HAMSTRING_STRETCHES[state.stretchIndex].name;
            const m = String(Math.floor(state.stretchTime / 60)).padStart(2, '0');
            const s = String(state.stretchTime % 60).padStart(2, '0');
            document.getElementById("stretch-timer").innerText = `${m}:${s}`;
            document.getElementById("stretch-step-text").innerText = `種目 ${state.stretchIndex + 1} / ${HAMSTRING_STRETCHES.length}`;
            document.getElementById("stretch-start-btn").innerText = state.stretchRunning ? "一時停止" : "スタート";
        }

        function toggleStretchTimer() {
            if (state.stretchRunning) {
                clearInterval(stretchInterval);
                state.stretchRunning = false;
            } else {
                state.stretchRunning = true;
                stretchInterval = setInterval(() => {
                    if (state.stretchTime > 0) {
                        state.stretchTime--;
                    } else {
                        nextStretch();
                    }
                    saveState();
                    renderStretchUI();
                }, 1000);
            }
            saveState();
            renderStretchUI();
        }

        function nextStretch() {
            clearInterval(stretchInterval);
            state.stretchRunning = false;
            state.stretchIndex++;
            state.stretchTime = 60;
            saveState();
            renderStretchUI();
        }

        function countUp(exIdx, setIdx) {
            const set = state.exercises[exIdx].setsData[setIdx];
            if (!set.locked) {
                set.count++;
                saveState();
                renderExercises();
            }
        }

        function toggleLockSet(exIdx, setIdx) {
            const set = state.exercises[exIdx].setsData[setIdx];
            set.locked = !set.locked;

            const allLocked = state.exercises[exIdx].setsData.every(s => s.locked);
            if (allLocked) {
                state.exercises[exIdx].completed = true;
                saveHistoryLog(state.exercises[exIdx].name, state.exercises[exIdx].weight, state.exercises[exIdx].reps, 3);
            }

            saveState();
            renderHeader();
            renderExercises();
        }

        function updateVal(idx, key, delta) {
            if (key === 'weight') {
                state.exercises[idx].weight = Math.max(0, state.exercises[idx].weight + delta);
            } else if (key === 'reps') {
                state.exercises[idx].reps = Math.max(1, state.exercises[idx].reps + delta);
            }
            saveState();
            renderExercises();
        }

        function toggleComplete(exIdx) {
            state.exercises[exIdx].completed = !state.exercises[exIdx].completed;
            if (state.exercises[exIdx].completed) {
                state.exercises[exIdx].setsData.forEach(s => s.locked = true);
                saveHistoryLog(state.exercises[exIdx].name, state.exercises[exIdx].weight, state.exercises[exIdx].reps, 3);
            } else {
                state.exercises[exIdx].setsData.forEach(s => s.locked = false);
            }
            saveState();
            renderHeader();
            renderExercises();
        }

        initApp();
    </script>
</body>
</html>
