<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>筋トレアプリ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <!-- 成長グラフ表示用のChart.jsライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --completed-bg: #0d2720;
            --completed-border: #10b981;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px 16px;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .today-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .workout-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .progress-container {
            background-color: #334155;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 6px;
        }

        .progress-bar {
            height: 100%;
            background-color: #10b981;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.85rem;
            color: var(--text-sub);
            text-align: right;
        }

        main {
            padding: 16px;
        }

        .special-day-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 32px 16px;
            text-align: center;
            border: 1px solid #334155;
            margin-top: 20px;
        }

        .special-day-title {
            font-size: 1.8rem;
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 12px;
        }

        .special-day-desc {
            color: var(--text-sub);
            font-size: 1rem;
        }

        .section-header {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 24px 0 12px 0;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }

        .exercise-card.completed {
            background-color: var(--completed-bg);
            border-color: var(--completed-border);
            opacity: 0.85;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .exercise-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .exercise-guide-box {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px dashed #334155;
        }

        .guide-icon {
            font-size: 2.2rem;
            line-height: 1;
        }

        .guide-info {
            flex: 1;
        }

        .guide-desc {
            font-size: 0.8rem;
            color: var(--text-sub);
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .yt-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #ff4545;
            font-size: 0.8rem;
            font-weight: bold;
            text-decoration: none;
            background-color: #2a1215;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #5c1d24;
        }

        .controls-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .number-control {
            display: flex;
            align-items: center;
            background-color: #0f172a;
            border-radius: 8px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        .btn-num {
            background-color: #334155;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
        }

        .num-val {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .sets-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .set-item-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .set-item-card.locked {
            background-color: #0d2720;
            border-color: #10b981;
        }

        .set-label {
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--text-sub);
            width: 60px;
        }

        .counter-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-count {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .count-display {
            font-size: 1rem;
            font-weight: bold;
            color: #38bdf8;
            min-width: 40px;
            text-align: center;
        }

        .btn-finish-set {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-complete {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .completed .btn-complete {
            background-color: #059669;
        }

        .chart-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            border: 1px solid #334155;
            margin-top: 12px;
        }

        .chart-select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background-color: #0f172a;
            color: white;
            border: 1px solid #334155;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .log-list {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: var(--border-radius);
            padding: 12px;
            max-height: 250px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .log-item {
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--text-sub);
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-top">
            <h1>筋トレアプリ</h1>
            <div id="today-badge" class="today-badge">-</div>
        </div>
        <div id="workout-title" class="workout-title">読み込み中...</div>
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">0 / 0 完了</div>
    </header>

    <main>
        <div id="special-day-container"></div>

        <div id="uncompleted-section">
            <div class="section-header">未完了の種目</div>
            <div id="uncompleted-list"></div>
        </div>

        <div id="completed-section" style="margin-top: 24px;">
            <div class="section-header">完了済みの種目</div>
            <div id="completed-list"></div>
        </div>

        <!-- 成長グラフ -->
        <div style="margin-top: 32px;">
            <div class="section-header">📈 重量・回数の成長推移グラフ</div>
            <div class="chart-card">
                <select id="chart-exercise-select" class="chart-select" onchange="updateChart()"></select>
                <canvas id="growthChart" height="200"></canvas>
            </div>
        </div>

        <!-- 履歴ログ -->
        <div style="margin-top: 32px;">
            <div class="section-header">📜 過去の全トレーニング記録</div>
            <div id="log-list" class="log-list"></div>
        </div>
    </main>

    <script>
        const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

        // アップロードされたCSVの過去記録データ（初期組み込み）
        const INITIAL_PAST_LOGS = [
            { timestamp: "2026/09/17 09:30", exercise: "ロープハンマーカール", weight: 15.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/17 09:30", exercise: "ケーブルフライ", weight: 10.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/17 09:20", exercise: "ケーブルサイドレイズ", weight: 5.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/17 09:17", exercise: "リアデルトフライ", weight: 6.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/17 09:10", exercise: "サイドレイズ", weight: 12.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/17 09:05", exercise: "ショルダープレス", weight: 20.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/15 19:51", exercise: "アシスト懸垂", weight: 14.0, reps: 5, sets: 3 },
            { timestamp: "2026/09/15 19:44", exercise: "ストレートアームプルダウン", weight: 15.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/15 19:28", exercise: "ダンベルカール", weight: 10.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/15 19:28", exercise: "ハンマーカール", weight: 10.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/15 19:16", exercise: "ワンアームローイング", weight: 14.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/15 19:07", exercise: "シーテッドローイング", weight: 35.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/15 18:59", exercise: "ラットプルダウン", weight: 35.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/14 18:50", exercise: "デッドバグ", weight: 0.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/14 18:41", exercise: "オーバーヘッドトライセプスエクステンション", weight: 10.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/14 18:31", exercise: "プレスダウン", weight: 15.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/14 18:24", exercise: "インクラインダンベルプレス", weight: 10.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/14 18:18", exercise: "ケーブルフライ", weight: 10.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/14 18:11", exercise: "チェストプレス", weight: 30.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/12 09:30", exercise: "レッグプレス", weight: 50.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/12 09:20", exercise: "スクワット", weight: 40.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/10 18:30", exercise: "ショルダープレス", weight: 18.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/10 18:20", exercise: "サイドレイズ", weight: 10.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/08 19:30", exercise: "ラットプルダウン", weight: 30.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/08 19:15", exercise: "シーテッドローイング", weight: 30.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/07 18:30", exercise: "チェストプレス", weight: 25.0, reps: 10, sets: 3 },
            { timestamp: "2026/09/07 18:15", exercise: "インクラインダンベルプレス", weight: 8.0, reps: 10, sets: 3 }
        ];

        const SCHEDULE = {
            "月": { title: "胸", special: null },
            "火": { title: "背中", special: null },
            "水": { title: "ボクシングレッスン", special: "今日はボクシングレッスン（筋トレなし）" },
            "木": { title: "肩・肩幅", special: null },
            "金": { title: "休養", special: "今日は休養日（筋トレなし）" },
            "土": { title: "全身", special: null },
            "日": { title: "弱点部位", special: null }
        };

        const INITIAL_MENU = {
            "月": ["チェストプレス", "ケーブルフライ", "インクラインダンベルプレス", "プレスダウン", "オーバーヘッドトライセプスエクステンション", "デッドバグ"],
            "火": ["ラットプルダウン", "シーテッドローイング", "ワンアームローイング", "フェイスプル", "ダンベルカール", "アブ系"],
            "木": ["ショルダープレス", "サイドレイズ", "リアデルトフライ", "ケーブルフライ", "フェイスプル", "アブ系"],
            "土": ["スクワット", "レッグプレス", "ラットプルダウン", "チェストプレス", "サイドレイズ", "アブ系"],
            "日": ["ショルダープレス", "ラットプルダウン", "ケーブルフライ", "レッグエクステンション", "ダンベルカール", "デッドバグ"]
        };

        const EXERCISE_GUIDE = {
            "チェストプレス": { icon: "🏋️‍♂️", desc: "シートに深めに座り、グリップを胸の高さで前方に押し出します。" },
            "ケーブルフライ": { icon: "🥷", desc: "胸を開いてケーブルを抱きかかえるように中心に寄せます。" },
            "インクラインダンベルプレス": { icon: "📐", desc: "ベンチを傾け、斜め上に向かってダンベルを押し上げます。" },
            "プレスダウン": { icon: "🪢", desc: "肘を固定し、ロープ・バーを下に向かって押し下げます。" },
            "オーバーヘッドトライセプスエクステンション": { icon: "🙆‍♂️", desc: "頭の後ろで重量を持ち、肘を上に向けて伸ばします。" },
            "デッドバグ": { icon: "🪲", desc: "仰向けで対角の手足を交互にゆっくり伸ばし体幹を鍛えます。" },
            "ラットプルダウン": { icon: "⬇️", desc: "バーを胸の上に引き寄せ、肩甲骨を下へ寄せます。" },
            "シーテッドローイング": { icon: "🚣‍♂️", desc: "お腹に向かってグリップを引いて背筋を収縮させます。" },
            "ワンアームローイング": { icon: "🏋️", desc: "片手片膝をベンチにつき、ダンベルを脇腹へ引き上げます。" },
            "フェイスプル": { icon: "👁️", desc: "ロープを顔の高さまで引き、肩の後ろと背中上部を鍛えます。" },
            "ダンベルカール": { icon: "💪", desc: "肘の位置を固定し、腕の力でダンベルを持ち上げます。" },
            "ショルダープレス": { icon: "🙆‍♂️", desc: "ダンベルまたはマシンを真上に向かって押し上げます。" },
            "サイドレイズ": { icon: "🦅", desc: "肘を軽く曲げ、肩の高さまで横に腕を持ち上げます。" },
            "リアデルトフライ": { icon: "🙇‍♂️", desc: "前傾姿勢になり、ダンベルを斜め後ろへ開くように持ち上げます。" },
            "スクワット": { icon: "🦵", desc: "お尻を後ろに引くようにしゃがみ、かかとで立ち上がります。" },
            "レッグプレス": { icon: "🦶", desc: "プレートに足を載せ、膝が内側に入らないよう押し出します。" }
        };

        let state = {
            dateStr: "",
            dayOfWeek: "",
            exercises: []
        };

        let myChart = null;

        function getTodayInfo() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${date}`;
            const dayOfWeek = WEEKDAYS[now.getDay()];
            return { dateStr, dayOfWeek, now };
        }

        function initApp() {
            const { dateStr, dayOfWeek } = getTodayInfo();
            state.dateStr = dateStr;
            state.dayOfWeek = dayOfWeek;

            if (!localStorage.getItem("kintore_logs")) {
                localStorage.setItem("kintore_logs", JSON.stringify(INITIAL_PAST_LOGS));
            }

            const saved = localStorage.getItem("kintore_data_" + dateStr);
            if (saved) {
                state = JSON.parse(saved);
            } else {
                const names = INITIAL_MENU[dayOfWeek] || [];
                state.exercises = names.map(name => ({
                    name: name,
                    weight: 20.0,
                    reps: 10,
                    setsData: [
                        { count: 0, locked: false },
                        { count: 0, locked: false },
                        { count: 0, locked: false }
                    ],
                    completed: false
                }));
                saveState();
            }

            renderHeader();
            renderContent();
            renderHistoryLogs();
            initChartSelect();
        }

        function saveState() {
            localStorage.setItem("kintore_data_" + state.dateStr, JSON.stringify(state));
        }

        function saveHistoryLog(exName, weight, reps, setsCount) {
            const { dateStr, now } = getTodayInfo();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const logs = JSON.parse(localStorage.getItem("kintore_logs") || "[]");

            logs.unshift({
                timestamp: `${dateStr.replace(/-/g, '/')} ${timeStr}`,
                exercise: exName,
                weight: weight,
                reps: reps,
                sets: setsCount
            });

            localStorage.setItem("kintore_logs", JSON.stringify(logs));
            renderHistoryLogs();
            updateChart();
        }

        function renderHistoryLogs() {
            const container = document.getElementById("log-list");
            const logs = JSON.parse(localStorage.getItem("kintore_logs") || "[]");

            if (logs.length === 0) {
                container.innerHTML = "まだ記録はありません。";
                return;
            }

            container.innerHTML = logs.map(l => `
                <div class="log-item">
                    <div>
                        <strong>${l.exercise}</strong> (${l.weight}kg × ${l.reps}回 × ${l.sets}セット)
                    </div>
                    <div class="log-time">${l.timestamp}</div>
                </div>
            `).join('');
        }

        function initChartSelect() {
            const select = document.getElementById("chart-exercise-select");
            const logs = JSON.parse(localStorage.getItem("kintore_logs") || "[]");
            const exercises = [...new Set(logs.map(l => l.exercise))];

            select.innerHTML = exercises.map(ex => `<option value="${ex}">${ex}</option>`).join('');
            if (exercises.length > 0) {
                updateChart();
            }
        }

        function updateChart() {
            const select = document.getElementById("chart-exercise-select");
            const selectedEx = select.value;
            const logs = JSON.parse(localStorage.getItem("kintore_logs") || "[]");

            const exLogs = logs.filter(l => l.exercise === selectedEx).reverse();

            const labels = exLogs.map(l => l.timestamp.split(' ')[0]);
            const weights = exLogs.map(l => l.weight);
            const totalReps = exLogs.map(l => l.reps * l.sets);

            const ctx = document.getElementById('growthChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '重量 (kg)',
                            data: weights,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.2)',
                            yAxisID: 'y',
                            tension: 0.2
                        },
                        {
                            label: '合計回数 (回)',
                            data: totalReps,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.2)',
                            yAxisID: 'y1',
                            tension: 0.2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    scales: {
                        x: { ticks: { color: '#94a3b8' } },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: 'kg', color: '#3b82f6' },
                            ticks: { color: '#94a3b8' }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: '回', color: '#10b981' },
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#94a3b8' }
                        }
                    },
                    plugins: {
                        legend: { labels: { color: '#f8fafc' } }
                    }
                }
            });
        }

        function renderHeader() {
            document.getElementById("today-badge").innerText = state.dayOfWeek + "曜日";
            const info = SCHEDULE[state.dayOfWeek];
            document.getElementById("workout-title").innerText = info.title;

            if (info.special) {
                document.getElementById("progress-bar").style.width = "0%";
                document.getElementById("progress-text").innerText = "";
            } else {
                const total = state.exercises.length;
                const done = state.exercises.filter(e => e.completed).length;
                const pct = total === 0 ? 0 : Math.round((done / total) * 100);
                document.getElementById("progress-bar").style.width = pct + "%";
                document.getElementById("progress-text").innerText = `${done} / ${total} 完了`;
            }
        }

        function renderContent() {
            const info = SCHEDULE[state.dayOfWeek];
            const specialContainer = document.getElementById("special-day-container");
            const uncompletedSection = document.getElementById("uncompleted-section");
            const completedSection = document.getElementById("completed-section");

            specialContainer.innerHTML = "";

            if (info.special) {
                specialContainer.innerHTML = `
                    <div class="special-day-card">
                        <div class="special-day-title">${info.special}</div>
                        <div class="special-day-desc">しっかりと身体を休めてコンディションを整えましょう。</div>
                    </div>
                `;
                uncompletedSection.style.display = "none";
                completedSection.style.display = "none";
                return;
            }

            uncompletedSection.style.display = "block";
            completedSection.style.display = "block";
            renderExercises();
        }

        function renderExercises() {
            const uncompletedList = document.getElementById("uncompleted-list");
            const completedList = document.getElementById("completed-list");

            uncompletedList.innerHTML = "";
            completedList.innerHTML = "";

            state.exercises.forEach((ex, idx) => {
                const card = document.createElement("div");
                card.className = "exercise-card" + (ex.completed ? " completed" : "");
                const guide = EXERCISE_GUIDE[ex.name] || { icon: "🏋️", desc: "フォームに注意して行いましょう。" };
                const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(ex.name + ' フォーム Shorts')}`;

                card.innerHTML = `
                    <div class="card-top">
                        <div class="exercise-name">${ex.name}</div>
                    </div>

                    <div class="exercise-guide-box">
                        <div class="guide-icon">${guide.icon}</div>
                        <div class="guide-info">
                            <div class="guide-desc">${guide.desc}</div>
                            <a href="${ytSearchUrl}" target="_blank" class="yt-link">🎬 Shortsで動画確認</a>
                        </div>
                    </div>

                    <div class="controls-row">
                        <div class="input-group">
                            <label>重量 (kg)</label>
                            <div class="number-control">
                                <button class="btn-num" onclick="updateVal(${idx}, 'weight', -0.5)">-</button>
                                <div class="num-val">${ex.weight.toFixed(1)}</div>
                                <button class="btn-num" onclick="updateVal(${idx}, 'weight', 0.5)">+</button>
                            </div>
                        </div>
                        <div class="input-group">
                            <label>目標回数</label>
                            <div class="number-control">
                                <button class="btn-num" onclick="updateVal(${idx}, 'reps', -1)">-</button>
                                <div class="num-val">${ex.reps}回</div>
                                <button class="btn-num" onclick="updateVal(${idx}, 'reps', 1)">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="sets-container">
                        ${ex.setsData.map((s, sIdx) => `
                            <div class="set-item-card ${s.locked ? 'locked' : ''}">
                                <div class="set-label">セット ${sIdx + 1}</div>
                                <div class="counter-box">
                                    ${s.locked ? `
                                        <div class="count-display" style="color:#10b981;">✓ ${s.count} 回完了</div>
                                    ` : `
                                        <button class="btn-count" onclick="countUp(${idx}, ${sIdx})">1回！</button>
                                        <div class="count-display">${s.count} / ${ex.reps}</div>
                                    `}
                                </div>
                                <button class="btn-finish-set" onclick="toggleLockSet(${idx},${sIdx})">
                                    ${s.locked ? '解除' : '終了'}
                                </button>
                            </div>
                        `).join('')}
                    </div>

                    <button class="btn-complete" onclick="toggleComplete(${idx})">
                        ${ex.completed ? '完了済み（タップで未完了へ戻す）' : 'この種目を完了する'}
                    </button>
                `;

                if (ex.completed) {
                    completedList.appendChild(card);
                } else {
                    uncompletedList.appendChild(card);
                }
            });
        }

        function countUp(exIdx, setIdx) {
            const set = state.exercises[exIdx].setsData[setIdx];
            if (!set.locked) {
                set.count++;
                saveState();
                renderExercises();
            }
        }

        function toggleLockSet(exIdx, setIdx) {
            const set = state.exercises[exIdx].setsData[setIdx];
            set.locked = !set.locked;

            const allLocked = state.exercises[exIdx].setsData.every(s => s.locked);
            if (allLocked) {
                state.exercises[exIdx].completed = true;
                saveHistoryLog(state.exercises[exIdx].name, state.exercises[exIdx].weight, state.exercises[exIdx].reps, 3);
            } else if (!set.locked) {
                state.exercises[exIdx].completed = false;
            }

            saveState();
            renderHeader();
            renderExercises();
        }

        function updateVal(idx, key, delta) {
            if (key === 'weight') {
                state.exercises[idx].weight = Math.max(0, state.exercises[idx].weight + delta);
            } else if (key === 'reps') {
                state.exercises[idx].reps = Math.max(1, state.exercises[idx].reps + delta);
            }
            saveState();
            renderExercises();
        }

        function toggleComplete(exIdx) {
            state.exercises[exIdx].completed = !state.exercises[exIdx].completed;
            if (state.exercises[exIdx].completed) {
                saveHistoryLog(state.exercises[exIdx].name, state.exercises[exIdx].weight, state.exercises[exIdx].reps, 3);
            }
            saveState();
            renderHeader();
            renderExercises();
        }

        initApp();
    </script>
</body>
</html>
