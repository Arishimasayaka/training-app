<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>50to60 Project</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --completed-bg: #0d2720;
            --completed-border: #10b981;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 12px 16px 8px 16px;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .today-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .date-picker-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            background-color: #0f172a;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .date-picker-row label {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: bold;
        }

        .date-picker-row input[type="date"] {
            background-color: #1e293b;
            color: white;
            border: 1px solid #475569;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .day-tabs {
            display: flex;
            justify-content: space-between;
            gap: 2px;
            margin-top: 6px;
            background-color: #0f172a;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .btn-day-tab {
            flex: 1;
            padding: 6px 0;
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .btn-day-tab.active {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-day-tab.disabled-tab {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-day-tab.is-today-marker::after {
            content: "•";
            display: block;
            font-size: 0.9rem;
            line-height: 0.2;
            color: #10b981;
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            gap: 6px;
            padding: 8px 16px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 122px;
            z-index: 90;
            white-space: nowrap;
        }

        .btn-cat-tab {
            padding: 8px 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: var(--text-sub);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-cat-tab.active {
            background-color: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }

        .workout-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
        }

        .workout-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .btn-reset-today {
            background-color: #334155;
            border: 1px solid #475569;
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .quick-actions-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 12px;
        }

        .btn-quick-act {
            padding: 8px 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            border: 1px solid #334155;
            cursor: pointer;
            text-align: center;
        }

        .btn-quick-boxing {
            background-color: #831843;
            color: #fbcfe8;
            border-color: #be185d;
        }

        .btn-quick-boxing.active-act {
            background-color: #be185d;
            color: white;
        }

        .btn-quick-none {
            background-color: #334155;
            color: #f1f5f9;
        }

        .btn-quick-none.active-act {
            background-color: #991b1b;
            color: #fca5a5;
        }

        .btn-quick-walk {
            background-color: #065f46;
            color: #a7f3d0;
            border-color: #059669;
        }

        .btn-quick-walk.active-act {
            background-color: #1e3a8a;
            color: #93c5fd;
        }

        .progress-container {
            background-color: #334155;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 2px;
        }

        .progress-bar {
            height: 100%;
            background-color: #10b981;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-align: right;
        }

        main {
            padding: 16px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .quote-card {
            background: linear-gradient(135deg, #1e1b4b, #311b92);
            border: 1px solid #6366f1;
            border-radius: var(--border-radius);
            padding: 12px 14px;
            margin-bottom: 16px;
        }

        .quote-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .quote-tag {
            font-size: 0.7rem;
            font-weight: bold;
            color: #a5b4fc;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .quote-refresh-btn {
            background: transparent;
            border: none;
            color: #c7d2fe;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }

        .quote-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
        }

        .section-header {
            font-size: 1rem;
            font-weight: 600;
            margin: 16px 0 10px 0;
            color: var(--text-sub);
        }

        .add-exercise-box {
            background-color: #1e293b;
            border: 1px dashed #3b82f6;
            border-radius: var(--border-radius);
            padding: 12px;
            margin-bottom: 16px;
        }

        .add-ex-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .add-ex-form-rows {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .add-ex-row-1 {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .add-ex-row-2 {
            display: flex;
            gap: 6px;
            align-items: center;
            width: 100%;
        }

        .input-group-item {
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 1;
            min-width: 0;
        }

        .input-group-item input {
            width: 100%;
            min-width: 0;
            background-color: #0f172a;
            color: white;
            border: 1px solid #334155;
            padding: 6px;
            border-radius: 6px;
            font-size: 0.8rem;
        }

        .input-unit-label {
            font-size: 0.75rem;
            color: var(--text-sub);
            white-space: nowrap;
            font-weight: bold;
        }

        .add-ex-form-rows select {
            background-color: #0f172a;
            color: white;
            border: 1px solid #334155;
            padding: 8px 4px;
            border-radius: 6px;
            font-size: 0.8rem;
            min-width: 0;
        }

        .btn-add-ex-submit {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #334155;
            position: relative;
        }

        .exercise-card.completed {
            background-color: var(--completed-bg);
            border-color: var(--completed-border);
            opacity: 0.9;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .muscle-badge {
            font-size: 0.85rem;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            color: white;
            display: inline-block;
            margin-right: 6px;
        }

        .muscle-badge-胸 { background-color: #ef4444; }
        .muscle-badge-背 { background-color: #3b82f6; }
        .muscle-badge-肩 { background-color: #eab308; color: #000; }
        .muscle-badge-腕 { background-color: #a855f7; }
        .muscle-badge-脚 { background-color: #10b981; }

        .exercise-name-link {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .exercise-name-link:hover {
            color: #38bdf8;
            text-decoration: underline;
        }

        .yt-icon-tag {
            font-size: 0.7rem;
            background-color: #ff4545;
            color: white;
            padding: 1px 4px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: bold;
        }

        .btn-swap-ex {
            background-color: #334155;
            border: 1px solid #475569;
            color: #fbbf24;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            margin-left: 6px;
        }

        .btn-edit-lock {
            background-color: #334155;
            border: 1px solid #475569;
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .exercise-diagram-box {
            background-color: #0f172a;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #334155;
        }

        .diagram-img {
            width: 85px;
            height: 85px;
            object-fit: contain;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 4px;
            flex-shrink: 0;
            border: 1px solid #475569;
        }

        .guide-info {
            flex: 1;
        }

        .guide-desc {
            font-size: 0.8rem;
            color: #cbd5e1;
            line-height: 1.35;
            margin-bottom: 4px;
        }

        .muscle-target-tag {
            font-size: 0.75rem;
            font-weight: bold;
            color: #10b981;
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid #059669;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
            display: inline-block;
        }

        .item-target-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: bold;
            color: #60a5fa;
            background-color: rgba(30, 58, 138, 0.5);
            border: 1px solid #1d4ed8;
            padding: 1px 6px;
            border-radius: 4px;
            margin-bottom: 4px;
        }

        .sets-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .set-item-card {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .set-item-card.locked {
            background-color: #0d2720;
            border-color: #10b981;
        }

        .set-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .set-label {
            font-weight: bold;
            font-size: 0.85rem;
            color: #38bdf8;
        }

        .set-controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .sub-control-box {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sub-control-box label {
            font-size: 0.7rem;
            color: var(--text-sub);
        }

        .number-control {
            display: flex;
            align-items: center;
            background-color: #1e293b;
            border-radius: 6px;
            border: 1px solid #475569;
            overflow: hidden;
        }

        .btn-num {
            background-color: #334155;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .num-val {
            flex: 1;
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .set-action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2px;
        }

        .count-display {
            font-size: 0.9rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .btn-finish-set {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-complete {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .timer-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 16px;
            margin-top: 12px;
            border: 1px solid #334155;
            text-align: center;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            font-family: monospace;
            margin: 6px 0;
            color: #38bdf8;
        }

        .stretch-nav-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background-color: #0f172a;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .btn-stretch-step {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            background: transparent;
            border: 1px solid #334155;
            color: var(--text-sub);
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-stretch-step.active {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-stretch-arrow {
            background-color: #334155;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-timer {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            background-color: var(--accent-color);
            color: white;
        }

        .spa-card {
            background: linear-gradient(135deg, #451a03, #1e293b);
            border: 1px solid #f97316;
            border-radius: var(--border-radius);
            padding: 16px;
            margin-top: 12px;
            position: relative;
            z-index: 10;
        }

        .spa-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .btn-spa-action {
            background-color: #292524;
            border: 1px solid #78350f;
            color: #fdba74;
            padding: 12px 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            position: relative;
            z-index: 20;
            touch-action: manipulation;
        }

        .btn-spa-action:active {
            background-color: #451a03;
            transform: scale(0.98);
        }

        .protein-card {
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            border: 1px solid #3b82f6;
            border-radius: var(--border-radius);
            padding: 16px;
            margin-top: 12px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 14px;
            border: 1px solid #334155;
            margin-top: 12px;
        }

        .chart-select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            background-color: #0f172a;
            color: white;
            border: 1px solid #334155;
            margin-bottom: 10px;
        }

        .log-list {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: var(--border-radius);
            padding: 10px;
            max-height: 280px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .log-item {
            padding: 8px 0;
            border-bottom: 1px solid #1e293b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-actions {
            display: flex;
            gap: 4px;
        }

        .btn-log-edit {
            background-color: #334155;
            color: #38bdf8;
            border: 1px solid #475569;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-log-del {
            background-color: #450a0a;
            color: #fca5a5;
            border: 1px solid #7f1d1d;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-csv-download {
            width: 100%;
            padding: 10px;
            background-color: #059669;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .habit-calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-top: 10px;
        }

        .habit-day-box {
            background-color: #0f
