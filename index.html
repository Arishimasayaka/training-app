<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>50to60 Project</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e293b">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --completed-bg: #0d2720;
            --completed-border: #10b981;
            --border-radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 60px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 12px 16px 8px 16px;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 1.1rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .today-badge {
            background-color: var(--accent-color);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .date-picker-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            background-color: #0f172a;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .date-picker-row label {
            font-size: 0.75rem;
            color: var(--text-sub);
            font-weight: bold;
        }

        .date-picker-row input[type="date"] {
            background-color: #1e293b;
            color: white;
            border: 1px solid #475569;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .day-tabs {
            display: flex;
            justify-content: space-between;
            gap: 2px;
            margin-top: 6px;
            background-color: #0f172a;
            padding: 3px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .btn-day-tab {
            flex: 1;
            padding: 6px 0;
            background: transparent;
            border: none;
            color: var(--text-sub);
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .btn-day-tab.active {
            background-color: var(--accent-color);
            color: white;
        }

        .btn-day-tab.disabled-tab {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-day-tab.is-today-marker::after {
            content: "•";
            display: block;
            font-size: 0.9rem;
            line-height: 0.2;
            color: #10b981;
        }

        .category-nav {
            display: flex;
            overflow-x: auto;
            gap: 6px;
            padding: 8px 16px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 122px;
            z-index: 90;
            white-space: nowrap;
        }

        .btn-cat-tab {
            padding: 8px 14px;
            background-color: #0f172a;
            border: 1px solid #334155;
            color: var(--text-sub);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-cat-tab.active {
            background-color: #3b82f6;
            color: white;
            border-color: #60a5fa;
        }

        .workout-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
        }

        .workout-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .btn-reset-today {
            background-color: #334155;
            border: 1px solid #475569;
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .quick-actions-bar {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 12px;
        }

        .btn-quick-act {
            padding: 8px 4px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.75rem;
            border: 1px solid #334155;
            cursor: pointer;
            text-align: center;
        }

        .btn-quick-boxing {
            background-color: #831843;
            color: #fbcfe8;
            border-color: #be185d;
        }

        .btn-quick-boxing.active-act {
            background-color: #be185d;
            color: white;
        }

        .btn-quick-none {
            background-color: #334155;
            color: #f1f5f9;
        }

        .btn-quick-none.active-act {
            background-color: #991b1b;
            color: #fca5a5;
        }

        .btn-quick-walk {
            background-color: #065f46;
            color: #a7f3d0;
            border-color: #059669;
        }

        .btn-quick-walk.active-act {
            background-color: #1e3a8a;
            color: #93c5fd;
        }

        .progress-container {
            background-color: #334155;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 2px;
        }

        .progress-bar {
            height: 100%;
            background-color: #10b981;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-align: right;
        }

        main {
            padding: 16px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .quote-card {
            background: linear-gradient(135deg, #1e1b4b, #311b92);
            border: 1px solid #6366f1;
            border-radius: var(--border-radius);
            padding: 12px 14px;
            margin-bottom: 16px;
        }

        .quote-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .quote-tag {
            font-size: 0.7rem;
            font-weight: bold;
            color: #a5b4fc;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .quote-refresh-btn {
            background: transparent;
            border: none;
            color: #c7d2fe;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: bold;
        }

        .quote-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.4;
        }

        .section-header {
            font-size: 1rem;
            font-weight: 600;
            margin: 16px 0 10px 0;
            color: var(--text-sub);
        }

        .add-exercise-box {
            background-color: #1e293b;
            border: 1px dashed #3b82f6;
            border-radius: var(--border-radius);
            padding: 12px;
            margin-bottom: 16px;
        }

        .add-ex-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        .add-ex-form-rows {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .add-ex-row-1 {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .add-ex-row-2 {
            display: flex;
            gap: 6px;
            align-items: center;
            width: 100%;
        }

        .input-group
